services:
  app:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      # Folderul PDF este montat ca volum; suprascrie valoarea din .env.
      PDF_DIR: /app/documents
      # Pentru profilul localdb decomentează linia de mai jos (sau schimb-o în .env):
      # DATABASE_URL: postgresql://indeco:practica2026@db:5432/model
    volumes:
      - ./documents:/app/documents
    restart: unless-stopped

  # Pornit doar cu: docker compose --profile localdb up
  db:
    image: pgvector/pgvector:pg18
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: indeco
      POSTGRES_PASSWORD: practica2026
      POSTGRES_DB: model
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
